<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      body {
          margin: 0px;
          padding: 0px;
          background: black;
      }

      #container {
          position: absolute;
          display: flex;
          width: 100%;
          height: 100%;
      }

      iframe {
          width: 100%;
          height: 100%;
          border: none;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <iframe id="game-screen" allow="autoplay"></iframe>
    </div>
  </body>

  <script>
    window.onload = () => {
      const query = new URLSearchParams(window.location.search)

      if (typeof query.get("title") !== "string" || !query.get("title").match(/^[\w-]+$/)) {
        throw new Error("title not found")
      }

      const logging = query.get("logging") === "false" ? "false" : "true"

      const iframe = document.querySelector("#game-screen")

      const container = document.querySelector("#container")

      const resize = () => {
        if (query.get("orientation") === "horizontal") {
          container.style.transform = `rotate(90deg) translateY(-${window.innerWidth}px)`
          container.style.transformOrigin = "0 0"
          container.style.height = window.innerWidth + "px"
          container.style.width = (window.innerHeight - 1) + "px"
        }
      }
      window.onresize = resize
      resize()

      fetch(`https://www.tsujio.org/game-${query.get("title")}/info.json`)
        .then((res) => res.json())
        .then((info) => {
          let url
          switch (info.language) {
            case "javascript":
              url = `./playjs.html?title=${query.get("title")}&logging=${logging}`
              break
            default:
              url = `./play.html?title=${query.get("title")}&compress=gz&logging=${logging}`
          }
          if (query.get("debug") === "true") {
            url += "&debug=true"
          }
          if (info.wasm_exec) {
            url += `&wasm_exec=${info.wasm_exec}`
          }
          iframe.src = url

          document.title = info.title
        })
    }
  </script>
</html>
