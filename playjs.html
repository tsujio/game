<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
          display: flex;
          margin: 0;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { default as $ } from "https://www.tsujio.org/gamelib-js/gamelib.v1.js"

      window.onload = () => {
        const query = new URLSearchParams(window.location.search)

        if (typeof query.get("title") !== "string" || !query.get("title").match(/^[\w-]+$/)) {
          throw new Error("title not found")
        }

        const logging = String(query.get("logging")) === "true"
        const debug = String(query.get("debug")) === "true"

        let playerId = localStorage.getItem("PLAYER_ID")
        if (!playerId) {
          playerId = crypto.randomUUID()
          localStorage.setItem("PLAYER_ID", playerId)
        }

        $.play({
          url: `https://www.tsujio.org/game-${query.get("title")}/${query.get("title")}.js`,
          logging,
          debug,
          playerId,
        })
      }
    </script>
  </body>
</html>
