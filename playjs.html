<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          position: absolute;
          width: 100%;
          height: 100%;
          touch-action: none;
      }

      #loading {
          display: flex;
          align-items: center;
          justify-content: center;
          background: black;
          color: white;
          width: 100%;
          height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading</div>

    <script type="module">
      const baseUrl = location.hostname === "localhost" ? location.origin : "https://www.tsujio.org/"

      const { default: $ } = await import(new URL("/gamelib-js/gamelib.js", baseUrl))

      const query = new URLSearchParams(window.location.search)

      if (typeof query.get("title") !== "string" || !query.get("title").match(/^[\w-]+$/)) {
        throw new Error("title not found")
      }

      const logging = String(query.get("logging")) === "true"
      const debug = String(query.get("debug")) === "true"

      const url = new URL(`/game-${query.get("title")}/${query.get("title")}.js`, baseUrl)

      $.play({
        url,
        logging,
        debug,
        onReady: () => {
          document.querySelector("#loading").remove()
        },
      })
    </script>
  </body>
</html>
