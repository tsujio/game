<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
          margin: 0;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          position: absolute;
          width: 100%;
          height: 100%;
          touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      const onLocal = window.location.hostname === "localhost"

      const gamelibUrl = onLocal ? "./gamelib-js/gamelib.js" : "https://www.tsujio.org/gamelib-js/gamelib.js"
      const { default: $ } = await import(gamelibUrl)

      const query = new URLSearchParams(window.location.search)

      if (typeof query.get("title") !== "string" || !query.get("title").match(/^[\w-]+$/)) {
        throw new Error("title not found")
      }

      const logging = String(query.get("logging")) === "true"
      const debug = String(query.get("debug")) === "true"

      let playerId = localStorage.getItem("PLAYER_ID")
      if (!playerId) {
        playerId = crypto.randomUUID()
        localStorage.setItem("PLAYER_ID", playerId)
      }

      const url = onLocal ?
        `./game-${query.get("title")}/${query.get("title")}.js` :
        `https://www.tsujio.org/game-${query.get("title")}/${query.get("title")}.js`

      $.play({
        url,
        logging,
        debug,
        playerId,
      })
    </script>
  </body>
</html>
